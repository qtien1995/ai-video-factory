<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width={{WIDTH}}, height={{HEIGHT}}">
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    html, body { 
      width: {{WIDTH}}px; 
      height: {{HEIGHT}}px; 
      overflow: hidden; 
      background: #ffffff;
      font-family: sans-serif;
    }
    .scene {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      opacity: 0; /* managed by GSAP */
      visibility: hidden;
    }
    
    /* Layout Primitives */
    .layout-centered { text-align: center; }
    .layout-split { display: flex; flex-direction: column; gap: 40px; text-align: center; }
    
    /* Text Primitives */
    .text-block { font-size: 60px; font-weight: bold; color: #333; margin: 10px 0; }
    .text-title { font-size: 90px; }

    /* Component specific classes */
    .flow-item { transform: translateY(100px); opacity: 0; }
    .interrupt-item { transform: translateX(0); }
    .progressive-item { transform: scale(0); opacity: 0; }
    .drain-container { /* context */ }
  </style>
</head>
<body>
  <div id="root" data-composition-id="main" data-duration="{{DURATION_SECONDS}}" data-width="{{WIDTH}}" data-height="{{HEIGHT}}">
    <!-- INJECT SCENES -->
    {{SCENES_HTML}}
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    // Global reveal of scenes
    {{SCENES_VISIBILITY_JS}}

    // INJECT GSAP ANIMATIONS
    {{GSAP_SCRIPT}}

    window.__timelines.main = tl;
    console.log("Timeline generated", tl.duration());
  </script>
</body>
</html>
