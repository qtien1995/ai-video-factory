<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">

  <defs>
    
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,600;0,700;0,800;0,900;1,700&amp;display=swap');
      * { font-family: 'Be Vietnam Pro', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .mono { font-family: 'SF Mono', Consolas, Monaco, monospace; }
      .glow-green { filter: url(#glowGreen); }
      .glow-cyan { filter: url(#glowCyan); }
      .glow-red { filter: url(#glowRed); }
      .glow-gold { filter: url(#glowGold); }
    </style>

    
    <!-- Gradients Background Deep OLED Space -->
    <radialGradient id="bgRadialOLED" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#071329"/>
      <stop offset="50%" stop-color="#030814"/>
      <stop offset="100%" stop-color="#010307"/>
    </radialGradient>
    
    <radialGradient id="bgRadialRed" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#1A0508"/>
      <stop offset="50%" stop-color="#0B0204"/>
      <stop offset="100%" stop-color="#020001"/>
    </radialGradient>

    <radialGradient id="bgRadialEmerald" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#042316"/>
      <stop offset="50%" stop-color="#020F0A"/>
      <stop offset="100%" stop-color="#010403"/>
    </radialGradient>

    <!-- Metallic Materials 3D -->
    <linearGradient id="gold3D" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF275"/>
      <stop offset="30%" stop-color="#EAB308"/>
      <stop offset="70%" stop-color="#CA8A04"/>
      <stop offset="100%" stop-color="#713F12"/>
    </linearGradient>

    <linearGradient id="steel3D" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="35%" stop-color="#94A3B8"/>
      <stop offset="70%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>

    <linearGradient id="darkSteel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <linearGradient id="emeraldGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="cyanGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="redGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F87171" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#DC2626" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glowGreen" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="glowCyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="glowRed" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="glowGold" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Isometric Grid Pattern -->
    <pattern id="isoGrid" width="60" height="104" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 60 52 L 30 104 L 0 52 Z" fill="none" stroke="#1E293B" stroke-width="0.75" stroke-opacity="0.25"/>
    </pattern>
  </defs>


    <!-- Deep Space Background -->
    <rect width="1080" height="1920" fill="url(#bgRadialEmerald)"/>
    <rect width="1080" height="1920" fill="url(#isoGrid)"/>

    <!-- Subtle Cityscape Skyline Silhouette at Bottom (Cut-out feel) -->
    <path d="M 0 1600 L 80 1520 L 140 1520 L 180 1440 L 260 1440 L 290 1350 L 330 1350 L 350 1280 L 390 1280 L 410 1380 L 480 1380 L 530 1460 L 620 1460 L 660 1320 L 710 1320 L 740 1420 L 820 1420 L 870 1490 L 960 1490 L 1000 1430 L 1080 1430 L 1080 1920 L 0 1920 Z" fill="#020813" fill-opacity="0.85"/>
    
    <!-- Top Minimal Eyebrow & Giant Stat (y: 280 - 450) -->
    <g transform="translate(90, 290)">
      <rect x="0" y="0" width="220" height="38" rx="19" fill="#10B981" fill-opacity="0.15" stroke="#10B981" stroke-width="1.5"/>
      <text x="110" y="24" text-anchor="middle" font-size="14" font-weight="900" fill="#34D399" letter-spacing="2">TẦM NHÌN 2045</text>
      
      <text x="0" y="95" font-size="44" font-weight="800" fill="#94A3B8">MỤC TIÊU PHẤN ĐẤU</text>
      <text x="0" y="165" font-size="80" font-weight="900" fill="#FFFFFF" letter-spacing="-1">TĂNG TRƯỞNG <tspan fill="#10B981">10%+</tspan></text>
    </g>

    <!-- 3D CENTRAL PIECE: Giant Golden Financial Reactor Turbine (70% Canvas) -->
    <g transform="translate(540, 940)">
      <!-- Ambient Outer Glow Aura -->
      <circle cx="0" cy="0" r="380" fill="#10B981" opacity="0.12" filter="url(#glowGreen)"/>
      <circle cx="0" cy="0" r="290" fill="none" stroke="#10B981" stroke-width="2" stroke-dasharray="12 8" opacity="0.6"/>
      <circle cx="0" cy="0" r="330" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="4 16" opacity="0.5"/>

      <!-- 12 Rotating Turbine Blades (Golden 3D) -->
      
      <g transform="rotate(0)">
        <path d="M 0 -70 C 40 -120 70 -200 30 -280 C -10 -270 -20 -180 0 -70 Z" fill="url(#gold3D)" opacity="0.9" stroke="#FEF08A" stroke-width="1"/>
        <line x1="0" y1="-70" x2="20" y2="-260" stroke="#FFF" stroke-width="1" opacity="0.5"/>
      </g>
      <g transform="rotate(30)">
        <path d="M 0 -70 C 40 -120 70 -200 30 -280 C -10 -270 -20 -180 0 -70 Z" fill="url(#gold3D)" opacity="0.9" stroke="#FEF08A" stroke-width="1"/>
        <line x1="0" y1="-70" x2="20" y2="-260" stroke="#FFF" stroke-width="1" opacity="0.5"/>
      </g>
      <g transform="rotate(60)">
        <path d="M 0 -70 C 40 -120 70 -200 30 -280 C -10 -270 -20 -180 0 -70 Z" fill="url(#gold3D)" opacity="0.9" stroke="#FEF08A" stroke-width="1"/>
        <line x1="0" y1="-70" x2="20" y2="-260" stroke="#FFF" stroke-width="1" opacity="0.5"/>
      </g>
      <g transform="rotate(90)">
        <path d="M 0 -70 C 40 -120 70 -200 30 -280 C -10 -270 -20 -180 0 -70 Z" fill="url(#gold3D)" opacity="0.9" stroke="#FEF08A" stroke-width="1"/>
        <line x1="0" y1="-70" x2="20" y2="-260" stroke="#FFF" stroke-width="1" opacity="0.5"/>
      </g>
      <g transform="rotate(120)">
        <path d="M 0 -70 C 40 -120 70 -200 30 -280 C -10 -270 -20 -180 0 -70 Z" fill="url(#gold3D)" opacity="0.9" stroke="#FEF08A" stroke-width="1"/>
        <line x1="0" y1="-70" x2="20" y2="-260" stroke="#FFF" stroke-width="1" opacity="0.5"/>
      </g>
      <g transform="rotate(150)">
        <path d="M 0 -70 C 40 -120 70 -200 30 -280 C -10 -270 -20 -180 0 -70 Z" fill="url(#gold3D)" opacity="0.9" stroke="#FEF08A" stroke-width="1"/>
        <line x1="0" y1="-70" x2="20" y2="-260" stroke="#FFF" stroke-width="1" opacity="0.5"/>
      </g>
      <g transform="rotate(180)">
        <path d="M 0 -70 C 40 -120 70 -200 30 -280 C -10 -270 -20 -180 0 -70 Z" fill="url(#gold3D)" opacity="0.9" stroke="#FEF08A" stroke-width="1"/>
        <line x1="0" y1="-70" x2="20" y2="-260" stroke="#FFF" stroke-width="1" opacity="0.5"/>
      </g>
      <g transform="rotate(210)">
        <path d="M 0 -70 C 40 -120 70 -200 30 -280 C -10 -270 -20 -180 0 -70 Z" fill="url(#gold3D)" opacity="0.9" stroke="#FEF08A" stroke-width="1"/>
        <line x1="0" y1="-70" x2="20" y2="-260" stroke="#FFF" stroke-width="1" opacity="0.5"/>
      </g>
      <g transform="rotate(240)">
        <path d="M 0 -70 C 40 -120 70 -200 30 -280 C -10 -270 -20 -180 0 -70 Z" fill="url(#gold3D)" opacity="0.9" stroke="#FEF08A" stroke-width="1"/>
        <line x1="0" y1="-70" x2="20" y2="-260" stroke="#FFF" stroke-width="1" opacity="0.5"/>
      </g>
      <g transform="rotate(270)">
        <path d="M 0 -70 C 40 -120 70 -200 30 -280 C -10 -270 -20 -180 0 -70 Z" fill="url(#gold3D)" opacity="0.9" stroke="#FEF08A" stroke-width="1"/>
        <line x1="0" y1="-70" x2="20" y2="-260" stroke="#FFF" stroke-width="1" opacity="0.5"/>
      </g>
      <g transform="rotate(300)">
        <path d="M 0 -70 C 40 -120 70 -200 30 -280 C -10 -270 -20 -180 0 -70 Z" fill="url(#gold3D)" opacity="0.9" stroke="#FEF08A" stroke-width="1"/>
        <line x1="0" y1="-70" x2="20" y2="-260" stroke="#FFF" stroke-width="1" opacity="0.5"/>
      </g>
      <g transform="rotate(330)">
        <path d="M 0 -70 C 40 -120 70 -200 30 -280 C -10 -270 -20 -180 0 -70 Z" fill="url(#gold3D)" opacity="0.9" stroke="#FEF08A" stroke-width="1"/>
        <line x1="0" y1="-70" x2="20" y2="-260" stroke="#FFF" stroke-width="1" opacity="0.5"/>
      </g>

      <!-- Center Reactor Core Sphere -->
      <circle cx="0" cy="0" r="130" fill="#021C11" stroke="#34D399" stroke-width="4"/>
      <circle cx="0" cy="0" r="115" fill="url(#emeraldGlass)"/>
      <circle cx="0" cy="0" r="90" fill="#010B07"/>

      <!-- Glowing Number at Core -->
      <text x="0" y="-10" text-anchor="middle" font-size="44" font-weight="900" fill="#FFFFFF" filter="url(#glowGreen)">$300B</text>
      <text x="0" y="28" text-anchor="middle" font-size="16" font-weight="800" fill="#34D399" letter-spacing="3">USD / NĂM</text>

      <!-- 4 Glowing Isometric Pipeline Beams Exiting Core -->
      <line x1="0" y1="130" x2="0" y2="390" stroke="#10B981" stroke-width="6" stroke-dasharray="16 8"/>
      <line x1="130" y1="0" x2="380" y2="0" stroke="#38BDF8" stroke-width="4" stroke-dasharray="12 6"/>
      <line x1="-130" y1="0" x2="-380" y2="0" stroke="#38BDF8" stroke-width="4" stroke-dasharray="12 6"/>
      <line x1="0" y1="-130" x2="0" y2="-390" stroke="#10B981" stroke-width="6" stroke-dasharray="16 8"/>
    </g>

    <!-- Bottom Minimal Key Callout (y: 1440 - 1530) -->
    <g transform="translate(90, 1450)">
      <text x="0" y="30" font-size="28" font-weight="800" fill="#F8FAFC">MỆNH LỆNH THOÁT BẪY "CHƯA GIÀU ĐÃ GIÀ"</text>
      <text x="0" y="65" font-size="20" font-weight="500" fill="#94A3B8">Ván cờ tài chính khổng lồ quyết định vận mệnh kinh tế.</text>
    </g>

</svg>