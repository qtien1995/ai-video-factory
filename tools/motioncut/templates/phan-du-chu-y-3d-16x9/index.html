<!doctype html>
<html lang="vi"><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts.css">
<style>
:root{--aqua:#22d3ee;--ice:#8ff0ff;--deep:#020b14;--mute:#8fb3c9;--coral:#fda4af;--gold:#ffd166}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:var(--deep)}
body{font-family:BVP,sans-serif;font-weight:600;color:#fff}
#stage{position:absolute;inset:0;overflow:hidden;background:radial-gradient(120% 90% at 50% 40%,#04192a 0%,#020b14 60%,#01060c 100%)}
.abs{position:absolute}
.serif{font-family:PF,serif;font-style:italic;font-weight:700}
.ice{color:var(--ice)}.coral{color:var(--coral)}.gold{color:var(--gold)}.vio{color:#c4b5fd}.grn{color:#6ee7b7}.org{color:#fdba74}.pnk{color:#f9a8d4}
.sh{text-shadow:0 0 3px rgba(1,10,20,.9),0 4px 26px rgba(1,10,20,.95),0 0 60px rgba(1,10,20,.6)}
.glow{position:absolute;inset:-200px;mix-blend-mode:screen}
.rib{position:absolute;border-radius:50%}
.r1{width:1700px;height:380px;left:300px;top:420px;background:linear-gradient(90deg,transparent 0%,#0369a1 20%,#06b6d4 50%,#67e8f9 62%,transparent 90%);filter:blur(70px);opacity:.8}
.r2{width:1300px;height:120px;left:520px;top:560px;background:linear-gradient(90deg,transparent,#a5f3fc 45%,#e0fdff 55%,transparent);filter:blur(26px);opacity:.55}
.r3{width:1100px;height:520px;left:1300px;top:120px;background:radial-gradient(closest-side,#0e7490,transparent);filter:blur(60px);opacity:.7}
.r4{width:900px;height:420px;left:0;top:900px;background:radial-gradient(closest-side,#075985,transparent);filter:blur(70px);opacity:.6}
#glowB .r1{background:linear-gradient(90deg,transparent 0%,#1e3a8a 20%,#2563eb 50%,#38bdf8 62%,transparent 90%)}
#glowB .r2{background:linear-gradient(90deg,transparent,#93c5fd 45%,#dbeafe 55%,transparent)}
#glowB .r3{background:radial-gradient(closest-side,#1d4ed8,transparent)}
#glowH .r1{background:linear-gradient(90deg,transparent 0%,#7c2d12 20%,#ea580c 50%,#fdba74 62%,transparent 90%)}
#glowH .r2{background:linear-gradient(90deg,transparent,#fed7aa 45%,#ffedd5 55%,transparent)}
#glowH .r3{background:radial-gradient(closest-side,#c2410c,transparent)}
#glowP .r1{background:linear-gradient(90deg,transparent 0%,#4c1d95 20%,#7c3aed 50%,#c4b5fd 62%,transparent 90%)}
#glowP .r2{background:linear-gradient(90deg,transparent,#ddd6fe 45%,#f5f3ff 55%,transparent)}
#glowP .r3{background:radial-gradient(closest-side,#6d28d9,transparent)}
#glowG .r1{background:linear-gradient(90deg,transparent 0%,#064e3b 20%,#10b981 50%,#6ee7b7 62%,transparent 90%)}
#glowG .r2{background:linear-gradient(90deg,transparent,#a7f3d0 45%,#ecfdf5 55%,transparent)}
#glowG .r3{background:radial-gradient(closest-side,#047857,transparent)}
#vign{position:absolute;inset:0;z-index:6;background:radial-gradient(85% 75% at 50% 50%,transparent 55%,rgba(0,4,10,.85) 100%);pointer-events:none}
#dim{position:absolute;inset:0;background:radial-gradient(ellipse 62% 46% at 50% 45%,rgba(1,6,12,.82),rgba(1,6,12,.35) 70%,transparent);opacity:0}
.scene{position:absolute;inset:0;opacity:0;z-index:1}
#gl{z-index:5}
.ctr{position:absolute;left:0;width:1920px;text-align:center}
.glass{background:rgba(3,14,24,.84);border:1.5px solid rgba(125,211,252,.28);border-radius:30px;box-shadow:0 30px 90px rgba(0,0,0,.55),0 0 60px rgba(34,211,238,.16)}
.pill{display:inline-flex;align-items:center;gap:14px;padding:16px 32px;border-radius:999px;font-size:36px;white-space:nowrap;background:rgba(4,24,40,.78);border:1.5px solid rgba(165,243,252,.6);box-shadow:0 0 26px rgba(34,211,238,.35),inset 0 0 18px rgba(103,232,249,.18);color:#e6fbff}
.pill.red{border-color:rgba(253,164,175,.8);box-shadow:0 0 26px rgba(251,113,133,.4);color:#ffe4e6}
.pill.hot{border-color:#fdba74;box-shadow:0 0 26px rgba(251,146,60,.45);color:#fff7ed}
.pill.vio{border-color:#c4b5fd;box-shadow:0 0 26px rgba(139,92,246,.45);color:#f5f3ff}
.pill.grn{border-color:#6ee7b7;box-shadow:0 0 26px rgba(52,211,153,.4);color:#ecfdf5}
.pill.org{border-color:#fdba74;box-shadow:0 0 26px rgba(251,146,60,.45);color:#fff7ed}
#lnx{position:absolute;left:34px;top:24px;width:440px;height:34px;overflow:hidden;z-index:7;border-radius:17px;background:rgba(1,8,15,.45);-webkit-mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent);mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent)}
#lnxIn{position:absolute;left:0;top:0;height:34px;white-space:nowrap;font-size:19px;line-height:34px;letter-spacing:1.5px;color:#9fd8ea}
#lnxIn span{display:inline-block;padding-right:56px}
#lnxIn b{color:#c4b5fd;font-weight:600}
.pill.strike{text-decoration:line-through;text-decoration-color:#fda4af;text-decoration-thickness:4px}
.kicker{font-size:30px;color:var(--mute);letter-spacing:4px;text-transform:uppercase}
.w{display:inline-block;opacity:0}
#cap2{position:absolute;left:50%;top:1002px;z-index:7;transform:translateX(-50%);width:max-content;max-width:1780px;padding:3px 22px;border-radius:14px;background:rgba(1,8,15,.5);font-size:27px;line-height:1.3;color:#bfe9f5;text-align:center;white-space:nowrap;opacity:0}
#cap{position:absolute;left:50%;top:916px;z-index:7;transform:translateX(-50%);width:max-content;max-width:1700px;padding:12px 34px;border-radius:20px;background:rgba(1,8,15,.64);font-size:40px;line-height:1.35;text-align:center;white-space:nowrap;opacity:0}
#cap span{color:rgba(255,255,255,.45)}#cap span.on{color:#fff}#cap span.now{color:var(--aqua)}
#fade{position:absolute;inset:0;z-index:8;background:#000;opacity:0}
</style></head>
<body><div id="stage">
<svg width="0" height="0" style="position:absolute"><defs>
  <linearGradient id="aq" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e0fdff"/><stop offset=".5" stop-color="#67e8f9"/><stop offset="1" stop-color="#0ea5e9"/></linearGradient>
</defs></svg>
</div>
<script src="gsap.min.js"></script>
<script src="three.min.js"></script>
<script src="timing.js"></script>
<script>
const STAGE = document.getElementById('stage');
const E = (tag, cls, parent, css, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (css) e.style.cssText = css; if (html != null) e.innerHTML = html; (parent || STAGE).appendChild(e); return e; };
const CTR = (parent, top, cls, css, html) => E('div', 'ctr ' + (cls || ''), parent, 'top:' + top + 'px;' + (css || ''), html);
const PILL = (parent, top, html, cls = '', css = '') => CTR(parent, top, '', 'opacity:0;' + css, `<span class="pill ${cls}">${html}</span>`);
const wordsEl = (el, text, cls = {}) => el.innerHTML = text.split(' ').map((w, i) => { const c = Object.keys(cls).find(k => cls[k].includes(i)); return `<span class="w${c ? ' ' + c : ''}">${w}</span>`; }).join(' ');

// ---------- nền ----------
for (const [id, op] of [['glow', 1], ['glowB', 0], ['glowH', 0], ['glowP', 0], ['glowG', 0]]) {
  const g = E('div', 'glow', STAGE); g.id = id; g.style.opacity = op;
  ['r1', 'r2', 'r3', 'r4'].forEach(c => E('div', 'rib ' + c, g));
}
const dim = E('div', null, STAGE); dim.id = 'dim';
const GB = () => document.getElementById('glowB'), GH = () => document.getElementById('glowH');

// ---------- thời gian theo voice ----------
const SEG = Object.fromEntries(TIMING.segs.map(s => [s.id, s]));
const st = id => SEG[id].start, en = id => SEG[id].end;
function at(id, word, nth = 0) {
  const w = word.toLowerCase(); let c = -1;
  for (const x of SEG[id].words) if (x.w.toLowerCase().includes(w)) { c++; if (c === nth) return x.s; }
  throw new Error('không thấy từ "' + word + '" (' + nth + ') trong ' + id);
}
const T = TIMING.total, tl = gsap.timeline({paused: true}); const SFX = [];
const fx = (t, kind, g = 1) => SFX.push({t: +Math.max(0, t).toFixed(3), kind, g});
const IN = {opacity: 1, y: 0, x: 0, scale: 1, filter: 'blur(0px)'};
const enter = (el, t, from = {}, d = .6) => tl.fromTo(el, {opacity: 0, y: 60, scale: .94, filter: 'blur(14px)', ...from}, {...IN, duration: d, ease: 'expo.out'}, t);
const leave = (el, t, to = {}, d = .45) => tl.to(el, {opacity: 0, scale: 1.08, filter: 'blur(14px)', duration: d, ease: 'power3.in', ...to}, t);
function reveal(el, t0, t1) { const ws = [...el.querySelectorAll('.w')], per = Math.min(.4, Math.max(.1, (t1 - t0) / ws.length));
  ws.forEach((w, i) => tl.fromTo(w, {opacity: 0, y: 50, filter: 'blur(12px)'}, {opacity: 1, y: 0, filter: 'blur(0px)', duration: .5, ease: 'expo.out'}, t0 + i * per)); }
function revealAt(el, id, list) {
  [...el.querySelectorAll('.w')].forEach((w, i) => { const [k, n] = list[Math.min(i, list.length - 1)]; tl.fromTo(w, {opacity: 0, y: 40, filter: 'blur(10px)'}, {opacity: 1, y: 0, filter: 'blur(0px)', duration: .4, ease: 'expo.out'}, at(id, k, n) - .05); });
}
const CARETS = [];
function typer(el, text, hl, t0, d) {
  const o = {n: 0};
  tl.fromTo(o, {n: 0}, {n: text.length, duration: d, ease: 'none', onUpdate() {
    const n = Math.round(o.n); let s = '';
    for (let i = 0; i < n; i++) s += (hl && i >= hl[0] && i < hl[1]) ? `<span class="ice">${text[i]}</span>` : text[i];
    el.innerHTML = s + '<span class="caret" style="display:inline-block;width:4px;height:1em;background:#22d3ee;vertical-align:-.12em;margin-left:4px"></span>';
  }}, t0);
  for (let i = 0; i < text.length; i += 2) if (text[i] !== ' ') fx(t0 + d * i / text.length, 'tick');
}
const show = (el, a, b) => { tl.set(el, {opacity: 1}, a); tl.set(el, {opacity: 0}, b); };
const sceneEl = id => { const e = E('div', 'scene', STAGE); e.id = id; return e; };
const NOCAP = new Set();

// ======================= 3D (three.js) =======================
// 1 đơn vị thế giới = 100 px; (0,0) = tâm khung hình; camera nhìn thẳng ở z=0.
const R = new THREE.WebGLRenderer({antialias: true, alpha: true, preserveDrawingBuffer: true});
R.setPixelRatio(1); R.setSize(1920, 1080); R.setClearColor(0x000000, 0); R.outputEncoding = THREE.sRGBEncoding;
const GL = R.domElement; GL.id = 'gl'; GL.style.cssText = 'position:absolute;left:0;top:0;width:1920px;height:1080px;pointer-events:none';
STAGE.appendChild(GL);
const scn = new THREE.Scene();
const cam = new THREE.PerspectiveCamera(30, 16 / 9, 1, 100); cam.position.set(0, 0, 5.4 / Math.tan(15 * Math.PI / 180));
scn.add(new THREE.AmbientLight(0x9fc4d9, .5));
const dl = new THREE.DirectionalLight(0xffffff, 1.15); dl.position.set(3, 6, 9); scn.add(dl);
const pl1 = new THREE.PointLight(0x22d3ee, 1.3, 40); pl1.position.set(-6, 3, 7); scn.add(pl1);
const pl2 = new THREE.PointLight(0xfdba74, .9, 40); pl2.position.set(7, -3, 6); scn.add(pl2);

const MAT = (c, o = {}) => new THREE.MeshStandardMaterial({color: c, emissive: o.e ?? c, emissiveIntensity: o.ei ?? .35, metalness: o.m ?? .25, roughness: o.r ?? .4, transparent: o.op != null, opacity: o.op ?? 1});
const CY = MAT(0x1aa6d8, {e: 0x035e8c, ei: .45, m: .1, r: .5}), ICE = MAT(0xcdeff7, {e: 0x4fc3dc, ei: .12, m: .1, r: .5}), GOLD = MAT(0xffc83d, {e: 0xb45309, ei: .7}),
  RED = MAT(0xfb7185, {e: 0x9f1239, ei: .75}), DARK = MAT(0x0d3047, {e: 0x04202f, ei: .5}), GREY = MAT(0x56778c, {e: 0x1a3a4d, ei: .3}), NAVY = MAT(0x0a4a6e, {e: 0x053553, ei: .6});
const EDGE = new THREE.LineBasicMaterial({color: 0xe0fdff, transparent: true, opacity: .4});
const box = (w, h, d, m, edge = true) => { const me = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m); if (edge) me.add(new THREE.LineSegments(new THREE.EdgesGeometry(me.geometry), EDGE)); return me; };
const cyl = (rt, rb, h, m, seg = 32) => new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg), m);
const sph = (r, m) => new THREE.Mesh(new THREE.SphereGeometry(r, 24, 16), m);
const tor = (r, t, m) => new THREE.Mesh(new THREE.TorusGeometry(r, t, 14, 40), m);
const grp = (...c) => { const g = new THREE.Group(); c.forEach(x => g.add(x)); return g; };
const at3 = (o, x, y, z = 0) => { o.position.set(x, y, z); return o; };
const clamp01 = x => Math.min(1, Math.max(0, x));
const ease = x => 1 - Math.pow(1 - clamp01(x), 3);
const eio = x => { x = clamp01(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const back = x => { x = clamp01(x); const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const pop = (o, t, t0, d = .4) => { o.visible = t >= t0; o.scale.setScalar(Math.max(.0001, back((t - t0) / d))); };
function labelPlane(txt, s, col = '#06394f', fs = 150) {
  const c = document.createElement('canvas'); c.width = c.height = 256; const x = c.getContext('2d');
  x.fillStyle = col; x.font = '800 ' + fs + 'px BVP, sans-serif'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText(txt, 128, 136);
  const tx = new THREE.CanvasTexture(c); tx.encoding = THREE.sRGBEncoding;
  return new THREE.Mesh(new THREE.PlaneGeometry(s, s), new THREE.MeshBasicMaterial({map: tx, transparent: true}));
}
const PROPS = [];
function prop(g, t0, t1, upd, base = 1) { scn.add(g); g.visible = false; PROPS.push({g, t0, t1, upd, base}); return g; }
function draw3d(t) {
  for (const p of PROPS) {
    const on = t >= p.t0 && t <= p.t1; p.g.visible = on; if (!on) continue;
    const k = Math.min(back((t - p.t0) / .6), ease((p.t1 - t) / .35));
    p.g.scale.setScalar(Math.max(.0001, k * p.base)); if (p.upd) p.upd(t, p.g, k);
  }
  cam.position.x = Math.sin(t * .23) * .5; cam.position.y = Math.sin(t * .17) * .25; cam.lookAt(0, 0, 0);
  R.render(scn, cam);
}
const bar3 = (w, m) => { const g = new THREE.BoxGeometry(w, 1, w); g.translate(0, .5, 0); const me = new THREE.Mesh(g, m); me.add(new THREE.LineSegments(new THREE.EdgesGeometry(g), EDGE)); return me; };
function makeBook(sc = 1) {
  const g = new THREE.Group(), L = new THREE.Group(), Rr = new THREE.Group();
  [[L, -1], [Rr, 1]].forEach(([h, s]) => { h.add(at3(box(1.5, .1, 2.1, NAVY), s * .76, 0, 0), at3(box(1.4, .12, 1.95, ICE, false), s * .72, .1, 0)); h.rotation.z = -s * .22; g.add(h); });
  g.scale.setScalar(sc); g.rotation.x = -.7; return g;
}
function makeGear(r, n, hub) {
  const g = new THREE.Group(), body = cyl(r, r, .5, CY); body.rotation.x = Math.PI / 2; g.add(body);
  for (let i = 0; i < n; i++) { const a = i * 2 * Math.PI / n, th = box(Math.min(.34, r * .3), .32, .5, CY); th.position.set(Math.cos(a) * (r + .15), Math.sin(a) * (r + .15), 0); th.rotation.z = a - Math.PI / 2; g.add(th); }
  const h = cyl(r * .35, r * .35, .62, hub); h.rotation.x = Math.PI / 2; g.add(h);
  const ring = tor(r * .62, .05, ICE); ring.position.z = .27; g.add(ring); return g;
}

// phụ đề tiếng Anh (nhỏ, dưới phụ đề tiếng Việt)
const ENG = {
 "a0": "Just a one-second glance at your phone?",
 "a1": "You think glancing at your phone a little while studying does no harm.",
 "a2": "Just one message, one notification, a few seconds, and you're right back.",
 "a3": "But there's another way of looking at it that you need to know.",
 "b1": "You can get back to your desk in a few seconds.",
 "b2": "But your mind doesn't come back that fast.",
 "c1": "In psychology there's a concept called Attention Residue.",
 "c2": "When you switch from task A to task B, part of your attention stays stuck on task A.",
 "c3": "You're still thinking about the message you just read while your eyes are on the book.",
 "c4": "The result is you do task B with a head that's only partly focused.",
 "c5": "Research on workplaces also shows that after an interruption, it can take quite a while to fully return to what you were doing.",
 "d1": "Imagine two friends who both sit down to study for three hours.",
 "d2": "The first keeps the phone beside their hand and glances at it every ten minutes.",
 "d3": "The second leaves the phone in another room, studies 50 minutes straight, then rests 10.",
 "d4": "At the end of the session, who really learned more?",
 "d5": "You don't need to sit longer, if you can sit more fully.",
 "e1": "A related concept is Deep Work.",
 "e2": "It's a state of full focus on one thing that demands thinking, with no distraction, long enough to produce quality results.",
 "e3": "In an age of constant notifications, this ability is getting rarer, and because it's rare, it's getting more valuable.",
 "e4": "To get stretches of deep work, schedule them like an appointment.",
 "e5": "To be pulled away less, turn off notifications and close every unrelated tab.",
 "e6": "To keep your flow, write down whatever pops into your head on paper and deal with it later.",
 "f1": "These changes sound very small.",
 "f2": "But remember, one hour of full focus can be worth more than three hours of patchwork sitting.",
 "f3": "From today, don't just ask how long you've been sitting.",
 "f4": "Ask how long you were truly present during that time.",
 "f5": "Don't split your attention among things that don't deserve it.",
 "g1": "Follow the channel to discover psychology principles that help you focus deeper."
};

// ---------- bộ dựng vật 3D dùng chung ----------
const makeClock = (h, m) => { const g = new THREE.Group(), face = cyl(.95, .95, .1, ICE), body = tor(1.0, .14, NAVY); face.rotation.x = Math.PI / 2; g.add(face, body);
  for (let i = 0; i < 12; i++) { const a = i * Math.PI / 6, tk = box(.05, i % 3 ? .1 : .2, .04, DARK, false); tk.position.set(Math.sin(a) * .8, Math.cos(a) * .8, .08); tk.rotation.z = -a; g.add(tk); }
  const hand = (len, w, ang, mt) => { const hm = new THREE.Mesh(new THREE.BoxGeometry(w, len, .05), mt); hm.position.y = len / 2; const p = new THREE.Group(); p.add(hm); p.position.z = .1; p.rotation.z = -ang; g.add(p); };
  hand(.5, .09, (h % 12 + m / 60) * Math.PI / 6, DARK); hand(.75, .06, m * Math.PI / 30, RED); g.add(at3(sph(.08, DARK), 0, 0, .1)); return g; };
const makePin = () => { const cone = new THREE.Mesh(new THREE.ConeGeometry(.42, 1.0, 24), RED); cone.rotation.x = Math.PI; return grp(at3(cone, 0, -.2), at3(sph(.5, RED), 0, .45), at3(sph(.2, ICE), 0, .45, .42)); };
const makeDumbbell = () => { const db = grp(at3(cyl(.07, .07, 1.9, ICE, 12), 0, 0), at3(cyl(.5, .5, .2, GOLD), -.85, 0), at3(cyl(.5, .5, .2, GOLD), .85, 0), at3(cyl(.4, .4, .16, CY), -1.05, 0), at3(cyl(.4, .4, .16, CY), 1.05, 0)); db.children.forEach(c => c.rotation.z = Math.PI / 2); return db; };
const makeShoe = () => { const up = sph(1, CY); up.scale.set(.85, .5, .38); up.position.set(-.35, -.02, 0); const toe = sph(1, CY); toe.scale.set(.55, .3, .36); toe.position.set(.6, -.16, 0);
  const g = grp(at3(box(2.1, .22, .8, DARK), 0, -.32), up, toe, at3(box(.35, .5, .6, ICE, false), -1.0, .05)); for (let i = 0; i < 3; i++) g.add(at3(box(.07, .05, .5, ICE, false), -.1 + i * .3, .3 - i * .04)); return g; };
const makeBrush = () => grp(at3(box(.16, 1.5, .14, ICE), 0, -.2), at3(box(.3, .45, .16, CY), 0, .75), ...Array.from({length: 5}, (_, i) => at3(box(.04, .22, .04, ICE, false), -.1 + i * .05, .98, .1)));
const makeCup = () => { const g = grp(at3(cyl(.55, .45, .9, ICE), 0, 0), at3(cyl(.5, .5, .03, MAT(0x6b4423, {ei: .15})), 0, .44), at3(tor(.28, .07, ICE), .65, 0)); g.steam = [0, 1, 2].map(i => { const s = sph(.1, MAT(0xffffff, {ei: .4, op: .35})); g.add(s); return s; }); return g; };
const makePlate = () => grp(at3(cyl(1.15, 1.0, .12, ICE), 0, 0), at3(cyl(.78, .72, .14, CY), 0, .02), at3(box(.08, 1.2, .06, ICE, false), 1.5, 0), at3(box(.08, 1.2, .06, ICE, false), -1.5, 0));
const makeHeart = () => { const s = new THREE.Shape(); s.moveTo(.25, .25); s.bezierCurveTo(.25, .25, .2, 0, 0, 0); s.bezierCurveTo(-.3, 0, -.3, .35, -.3, .35); s.bezierCurveTo(-.3, .55, -.1, .77, .25, .95); s.bezierCurveTo(.6, .77, .8, .55, .8, .35); s.bezierCurveTo(.8, .35, .8, 0, .5, 0); s.bezierCurveTo(.35, 0, .25, .25, .25, .25);
