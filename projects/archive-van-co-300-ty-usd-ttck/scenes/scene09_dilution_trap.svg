<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">

  <defs>
    
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,600;0,700;0,800;0,900;1,700&amp;display=swap');
      * { font-family: 'Be Vietnam Pro', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .mono { font-family: 'SF Mono', Consolas, Monaco, monospace; }
      .glow-green { filter: url(#glowGreen); }
      .glow-cyan { filter: url(#glowCyan); }
      .glow-red { filter: url(#glowRed); }
      .glow-gold { filter: url(#glowGold); }
    </style>

    
    <!-- Gradients Background Deep OLED Space -->
    <radialGradient id="bgRadialOLED" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#071329"/>
      <stop offset="50%" stop-color="#030814"/>
      <stop offset="100%" stop-color="#010307"/>
    </radialGradient>
    
    <radialGradient id="bgRadialRed" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#1A0508"/>
      <stop offset="50%" stop-color="#0B0204"/>
      <stop offset="100%" stop-color="#020001"/>
    </radialGradient>

    <radialGradient id="bgRadialEmerald" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#042316"/>
      <stop offset="50%" stop-color="#020F0A"/>
      <stop offset="100%" stop-color="#010403"/>
    </radialGradient>

    <!-- Metallic Materials 3D -->
    <linearGradient id="gold3D" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF275"/>
      <stop offset="30%" stop-color="#EAB308"/>
      <stop offset="70%" stop-color="#CA8A04"/>
      <stop offset="100%" stop-color="#713F12"/>
    </linearGradient>

    <linearGradient id="steel3D" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="35%" stop-color="#94A3B8"/>
      <stop offset="70%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>

    <linearGradient id="darkSteel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <linearGradient id="emeraldGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="cyanGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="redGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F87171" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#DC2626" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glowGreen" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="glowCyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="glowRed" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="glowGold" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Isometric Grid Pattern -->
    <pattern id="isoGrid" width="60" height="104" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 60 52 L 30 104 L 0 52 Z" fill="none" stroke="#1E293B" stroke-width="0.75" stroke-opacity="0.25"/>
    </pattern>
  </defs>


    <rect width="1080" height="1920" fill="url(#bgRadialOLED)"/>
    <rect width="1080" height="1920" fill="url(#isoGrid)"/>

    <g transform="translate(90, 290)">
      <rect x="0" y="0" width="280" height="38" rx="19" fill="#EF4444" fill-opacity="0.15" stroke="#EF4444" stroke-width="1.5"/>
      <text x="140" y="24" text-anchor="middle" font-size="14" font-weight="900" fill="#F87171" letter-spacing="2">TƯ DUY NGHỊCH ĐẢO</text>
      
      <text x="0" y="95" font-size="44" font-weight="800" fill="#94A3B8">CẨN TRỌNG TỬ HUYỆT</text>
      <text x="0" y="165" font-size="76" font-weight="900" fill="#FFFFFF">BẪY <tspan fill="#EF4444">IN GIẤY TĂNG VỐN</tspan></text>
    </g>

    <!-- 3D CENTRAL PIECE: Balloon Pricked by EPS Needle & Magnet Sucking Capital -->
    <g transform="translate(540, 950)">
      <!-- Left Metaphor: Giant Inflated Stock Bubble being Pricked -->
      <g transform="translate(-160, 0)">
        <!-- Overinflated Stock Balloon -->
        <ellipse cx="0" cy="-40" rx="170" ry="210" fill="url(#redGlass)" stroke="#EF4444" stroke-width="3" filter="url(#glowRed)"/>
        <text x="0" y="-70" text-anchor="middle" font-size="28" font-weight="900" fill="#FFF">PHÁT HÀNH 1:1</text>
        <text x="0" y="-30" text-anchor="middle" font-size="18" font-weight="700" fill="#FEF08A">TĂNG VỐN ẢO</text>

        <!-- Sharp Needle Labelled EPS Piercing it -->
        <g transform="translate(130, -110) rotate(-45)">
          <polygon points="0,0 20,-140 -20,-140" fill="#E2E8F0" stroke="#FFF" stroke-width="2"/>
          <rect x="-15" y="-170" width="30" height="30" fill="#EF4444"/>
          <text x="0" y="-80" text-anchor="middle" font-size="16" font-weight="900" fill="#0F172A" transform="rotate(90)">EPS LAO DỐC</text>
        </g>
        <text x="0" y="220" text-anchor="middle" font-size="20" font-weight="800" fill="#F87171">BẪY PHA LOÃNG CỔ PHIẾU</text>
      </g>

      <!-- Right Metaphor: Mega Magnet (TPCP Crowding-out Sucking Private Cash) -->
      <g transform="translate(240, 0)">
        <!-- Horseshoe Magnet 3D -->
        <path d="M -70,-100 A 70 70 0 0 1 70,-100 L 70,60 L 30,60 L 30,-90 A 30 30 0 0 0 -30,-90 L -30,60 L -70,60 Z" fill="#DC2626" stroke="#991B1B" stroke-width="3"/>
        <rect x="-70" y="60" width="40" height="35" fill="#E2E8F0"/>
        <rect x="30" y="60" width="40" height="35" fill="#E2E8F0"/>
        
        <!-- Sucking in Gold Coins from Small SMEs -->
        <circle cx="0" cy="140" r="16" fill="url(#gold3D)"/>
        <circle cx="-40" cy="180" r="14" fill="url(#gold3D)"/>
        <circle cx="50" cy="170" r="18" fill="url(#gold3D)"/>
        <text x="0" y="-30" text-anchor="middle" font-size="18" font-weight="900" fill="#FFF">TRÁI PHIẾU</text>
        <text x="0" y="-8" text-anchor="middle" font-size="14" font-weight="800" fill="#FFF">CHÍNH PHỦ</text>
        <text x="0" y="220" text-anchor="middle" font-size="20" font-weight="800" fill="#F59E0B">LẤN ÁT VỐN TƯ NHÂN</text>
      </g>
    </g>

    <g transform="translate(90, 1460)">
      <text x="0" y="30" font-size="28" font-weight="900" fill="#EF4444">TIÊU CHUẨN SỐNG CÒN: DÒNG TIỀN KINH DOANH (CFO) PHẢI DƯƠNG</text>
      <text x="0" y="65" font-size="20" font-weight="500" fill="#94A3B8">Ở chu kỳ này, vẽ dự án trên giấy sẽ bị thị trường đào thải không thương tiếc.</text>
    </g>

</svg>