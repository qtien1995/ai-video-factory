<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">

  <defs>
    
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,600;0,700;0,800;0,900;1,700&amp;display=swap');
      * { font-family: 'Be Vietnam Pro', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .mono { font-family: 'SF Mono', Consolas, Monaco, monospace; }
      .glow-green { filter: url(#glowGreen); }
      .glow-cyan { filter: url(#glowCyan); }
      .glow-red { filter: url(#glowRed); }
      .glow-gold { filter: url(#glowGold); }
    </style>

    
    <!-- Gradients Background Deep OLED Space -->
    <radialGradient id="bgRadialOLED" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#071329"/>
      <stop offset="50%" stop-color="#030814"/>
      <stop offset="100%" stop-color="#010307"/>
    </radialGradient>
    
    <radialGradient id="bgRadialRed" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#1A0508"/>
      <stop offset="50%" stop-color="#0B0204"/>
      <stop offset="100%" stop-color="#020001"/>
    </radialGradient>

    <radialGradient id="bgRadialEmerald" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#042316"/>
      <stop offset="50%" stop-color="#020F0A"/>
      <stop offset="100%" stop-color="#010403"/>
    </radialGradient>

    <!-- Metallic Materials 3D -->
    <linearGradient id="gold3D" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF275"/>
      <stop offset="30%" stop-color="#EAB308"/>
      <stop offset="70%" stop-color="#CA8A04"/>
      <stop offset="100%" stop-color="#713F12"/>
    </linearGradient>

    <linearGradient id="steel3D" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="35%" stop-color="#94A3B8"/>
      <stop offset="70%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>

    <linearGradient id="darkSteel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <linearGradient id="emeraldGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="cyanGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="redGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F87171" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#DC2626" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glowGreen" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="glowCyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="glowRed" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="glowGold" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Isometric Grid Pattern -->
    <pattern id="isoGrid" width="60" height="104" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 60 52 L 30 104 L 0 52 Z" fill="none" stroke="#1E293B" stroke-width="0.75" stroke-opacity="0.25"/>
    </pattern>
  </defs>


    <rect width="1080" height="1920" fill="url(#bgRadialOLED)"/>
    <rect width="1080" height="1920" fill="url(#isoGrid)"/>

    <g transform="translate(90, 290)">
      <rect x="0" y="0" width="280" height="38" rx="19" fill="#818CF8" fill-opacity="0.15" stroke="#818CF8" stroke-width="1.5"/>
      <text x="140" y="24" text-anchor="middle" font-size="14" font-weight="900" fill="#A5B4FC" letter-spacing="2">SMART MONEY DẪN DẮT</text>
      
      <text x="0" y="95" font-size="44" font-weight="800" fill="#94A3B8">CHUYỂN GIAO THẾ HỆ</text>
      <text x="0" y="165" font-size="76" font-weight="900" fill="#FFFFFF">BÀN CỜ <tspan fill="#818CF8">ĐỊNH CHẾ</tspan></text>
    </g>

    <!-- 3D CENTRAL PIECE: Institutional Chessboard with Massive Monoliths Crushing Small Pawns -->
    <g transform="translate(540, 950)">
      <!-- 3D Isometric Chessboard Base -->
      <polygon points="0,-240 380,-60 0,120 -380,-60" fill="#0B132B" stroke="#334155" stroke-width="4"/>

      <!-- 3 Giant Marble / Titanium Monoliths (Institutions Standing Tall) -->
      <!-- Monolith 1: Pension Funds -->
      <g transform="translate(-180, -120)">
        <polygon points="0,-160 55,-130 55,20 0,0 -55,-30 -55,-130" fill="#334155" stroke="#818CF8" stroke-width="2"/>
        <polygon points="0,-160 55,-130 0,-100 -55,-130" fill="#475569"/>
        <text x="0" y="-40" text-anchor="middle" font-size="14" font-weight="900" fill="#A5B4FC">PENSION</text>
        <text x="0" y="-20" text-anchor="middle" font-size="11" font-weight="700" fill="#E0E7FF">HƯU TRÍ</text>
      </g>

      <!-- Monolith 2: Sovereign Wealth Funds (Center King) -->
      <g transform="translate(0, -60)">
        <polygon points="0,-220 75,-180 75,40 0,0 -75,-40 -75,-180" fill="url(#steel3D)" stroke="#FEF08A" stroke-width="3" filter="url(#glowGold)"/>
        <polygon points="0,-220 75,-180 0,-140 -75,-180" fill="#FEF08A"/>
        <text x="0" y="-80" text-anchor="middle" font-size="18" font-weight="900" fill="#0F172A">SWF</text>
        <text x="0" y="-55" text-anchor="middle" font-size="12" font-weight="800" fill="#713F12">QUỐC GIA</text>
      </g>

      <!-- Monolith 3: Life Insurance -->
      <g transform="translate(180, -120)">
        <polygon points="0,-160 55,-130 55,20 0,0 -55,-30 -55,-130" fill="#334155" stroke="#38BDF8" stroke-width="2"/>
        <polygon points="0,-160 55,-130 0,-100 -55,-130" fill="#475569"/>
        <text x="0" y="-40" text-anchor="middle" font-size="14" font-weight="900" fill="#38BDF8">INSURANCE</text>
        <text x="0" y="-20" text-anchor="middle" font-size="11" font-weight="700" fill="#E0E7FF">BẢO HIỂM</text>
      </g>

      <!-- Swept away tiny plastic pawns (Retail F0 fleeing in a whirlwind) -->
      <g transform="translate(0, 180)">
        <circle cx="-160" cy="20" r="14" fill="#EF4444" opacity="0.7"/>
        <circle cx="-80" cy="60" r="12" fill="#F59E0B" opacity="0.6"/>
        <circle cx="120" cy="30" r="15" fill="#EF4444" opacity="0.7"/>
        <circle cx="210" cy="50" r="11" fill="#F59E0B" opacity="0.5"/>
        <path d="M -220,50 Q 0,120 240,40" stroke="#64748B" stroke-width="2" stroke-dasharray="6 6" fill="none"/>
        <text x="0" y="90" text-anchor="middle" font-size="18" font-weight="800" fill="#EF4444">90% F0 LƯỚT SÓNG TÂM LÝ BỊ ĐÀO THẢI</text>
      </g>
    </g>

    <g transform="translate(90, 1460)">
      <text x="0" y="30" font-size="28" font-weight="900" fill="#A5B4FC">CHẤM DỨT THỜI KỲ ĐÁNH BẠC THEO TIN ĐỒN</text>
      <text x="0" y="65" font-size="20" font-weight="500" fill="#94A3B8">Định giá tài sản và năng lực quản trị doanh nghiệp lên ngôi.</text>
    </g>

</svg>