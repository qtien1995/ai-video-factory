<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">

  <defs>
    
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,600;0,700;0,800;0,900;1,700&amp;display=swap');
      * { font-family: 'Be Vietnam Pro', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .mono { font-family: 'SF Mono', Consolas, Monaco, monospace; }
      .glow-green { filter: url(#glowGreen); }
      .glow-cyan { filter: url(#glowCyan); }
      .glow-red { filter: url(#glowRed); }
      .glow-gold { filter: url(#glowGold); }
    </style>

    
    <!-- Gradients Background Deep OLED Space -->
    <radialGradient id="bgRadialOLED" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#071329"/>
      <stop offset="50%" stop-color="#030814"/>
      <stop offset="100%" stop-color="#010307"/>
    </radialGradient>
    
    <radialGradient id="bgRadialRed" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#1A0508"/>
      <stop offset="50%" stop-color="#0B0204"/>
      <stop offset="100%" stop-color="#020001"/>
    </radialGradient>

    <radialGradient id="bgRadialEmerald" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#042316"/>
      <stop offset="50%" stop-color="#020F0A"/>
      <stop offset="100%" stop-color="#010403"/>
    </radialGradient>

    <!-- Metallic Materials 3D -->
    <linearGradient id="gold3D" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF275"/>
      <stop offset="30%" stop-color="#EAB308"/>
      <stop offset="70%" stop-color="#CA8A04"/>
      <stop offset="100%" stop-color="#713F12"/>
    </linearGradient>

    <linearGradient id="steel3D" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="35%" stop-color="#94A3B8"/>
      <stop offset="70%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>

    <linearGradient id="darkSteel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <linearGradient id="emeraldGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="cyanGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="redGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F87171" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#DC2626" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glowGreen" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="glowCyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="glowRed" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="glowGold" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Isometric Grid Pattern -->
    <pattern id="isoGrid" width="60" height="104" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 60 52 L 30 104 L 0 52 Z" fill="none" stroke="#1E293B" stroke-width="0.75" stroke-opacity="0.25"/>
    </pattern>
  </defs>


    <rect width="1080" height="1920" fill="url(#bgRadialEmerald)"/>
    <rect width="1080" height="1920" fill="url(#isoGrid)"/>

    <g transform="translate(90, 290)">
      <rect x="0" y="0" width="280" height="38" rx="19" fill="#10B981" fill-opacity="0.15" stroke="#10B981" stroke-width="1.5"/>
      <text x="140" y="24" text-anchor="middle" font-size="14" font-weight="900" fill="#34D399" letter-spacing="2">KỶ NGUYÊN TÁI ĐỊNH GIÁ</text>
      
      <text x="0" y="95" font-size="44" font-weight="800" fill="#94A3B8">THANH KHOẢN MỤC TIÊU</text>
      <text x="0" y="175" font-size="96" font-weight="900" fill="url(#emeraldGlass)" filter="url(#glowGreen)">$2B - $3B</text>
      <text x="440" y="155" font-size="26" font-weight="800" fill="#34D399">/ MỖI PHIÊN</text>
    </g>

    <!-- 3D CENTRAL PIECE: P/E Rocket Booster & Global Upgrade Medals -->
    <g transform="translate(540, 960)">
      <!-- Rocket Thruster Exhaust Flare -->
      <polygon points="0,180 -80,360 80,360" fill="url(#gold3D)" opacity="0.8" filter="url(#glowGold)"/>
      <polygon points="0,180 -40,320 40,320" fill="#FFF" opacity="0.9"/>

      <!-- Vertical Launch Rail with P/E Meter Markings -->
      <rect x="-180" y="-320" width="360" height="520" fill="#061A12" stroke="#10B981" stroke-width="2" rx="16" opacity="0.85"/>
      <line x1="-150" y1="120" x2="150" y2="120" stroke="#334155" stroke-width="2"/>
      <text x="-140" y="110" font-size="20" font-weight="700" fill="#64748B">P/E 12x (QUÁ KHỨ CẬN BIÊN)</text>

      <line x1="-150" y1="-140" x2="150" y2="-140" stroke="#10B981" stroke-width="3" stroke-dasharray="8 6"/>
      <text x="-140" y="-155" font-size="26" font-weight="900" fill="#34D399">MỤC TIÊU: P/E 16x - 18x</text>

      <!-- 3D Sleek Financial Rocket -->
      <path d="M 0 -280 C 40 -180 50 40 40 180 L -40 180 C -50 40 -40 -180 0 -280 Z" fill="url(#steel3D)" stroke="#FFF" stroke-width="3"/>
      <!-- Rocket Fins -->
      <polygon points="-40,120 -90,190 -40,180" fill="#1E293B"/>
      <polygon points="40,120 90,190 40,180" fill="#1E293B"/>
      <!-- Cockpit Window -->
      <circle cx="0" cy="-140" r="24" fill="#38BDF8" stroke="#FFF" stroke-width="2"/>

      <!-- 2 Floating 3D Golden Medallions (FTSE & MSCI) -->
      <g transform="translate(-250, -40)">
        <circle cx="0" cy="0" r="65" fill="url(#gold3D)" stroke="#FEF08A" stroke-width="4" filter="url(#glowGold)"/>
        <circle cx="0" cy="0" r="50" fill="#042F1A"/>
        <text x="0" y="5" text-anchor="middle" font-size="16" font-weight="900" fill="#FEF08A">FTSE</text>
        <text x="0" y="24" text-anchor="middle" font-size="11" font-weight="700" fill="#34D399">EMERGING</text>
      </g>

      <g transform="translate(250, -40)">
        <circle cx="0" cy="0" r="65" fill="url(#gold3D)" stroke="#FEF08A" stroke-width="4" filter="url(#glowGold)"/>
        <circle cx="0" cy="0" r="50" fill="#042F1A"/>
        <text x="0" y="5" text-anchor="middle" font-size="16" font-weight="900" fill="#FEF08A">MSCI</text>
        <text x="0" y="24" text-anchor="middle" font-size="11" font-weight="700" fill="#34D399">UPGRADE</text>
      </g>
    </g>

    <g transform="translate(90, 1460)">
      <text x="0" y="30" font-size="28" font-weight="900" fill="#34D399">HÀNG CHỤC TỶ USD VỐN NGOẠI TỰ ĐỘNG GIẢI NGÂN</text>
      <text x="0" y="65" font-size="20" font-weight="500" fill="#94A3B8">Thanh khoản 50.000 – 80.000 tỷ đồng trở thành bình thường mới.</text>
    </g>

</svg>