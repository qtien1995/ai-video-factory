<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">

  <defs>
    
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,600;0,700;0,800;0,900;1,700&amp;display=swap');
      * { font-family: 'Be Vietnam Pro', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .mono { font-family: 'SF Mono', Consolas, Monaco, monospace; }
      .glow-green { filter: url(#glowGreen); }
      .glow-cyan { filter: url(#glowCyan); }
      .glow-red { filter: url(#glowRed); }
      .glow-gold { filter: url(#glowGold); }
    </style>

    
    <!-- Gradients Background Deep OLED Space -->
    <radialGradient id="bgRadialOLED" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#071329"/>
      <stop offset="50%" stop-color="#030814"/>
      <stop offset="100%" stop-color="#010307"/>
    </radialGradient>
    
    <radialGradient id="bgRadialRed" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#1A0508"/>
      <stop offset="50%" stop-color="#0B0204"/>
      <stop offset="100%" stop-color="#020001"/>
    </radialGradient>

    <radialGradient id="bgRadialEmerald" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#042316"/>
      <stop offset="50%" stop-color="#020F0A"/>
      <stop offset="100%" stop-color="#010403"/>
    </radialGradient>

    <!-- Metallic Materials 3D -->
    <linearGradient id="gold3D" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF275"/>
      <stop offset="30%" stop-color="#EAB308"/>
      <stop offset="70%" stop-color="#CA8A04"/>
      <stop offset="100%" stop-color="#713F12"/>
    </linearGradient>

    <linearGradient id="steel3D" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="35%" stop-color="#94A3B8"/>
      <stop offset="70%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>

    <linearGradient id="darkSteel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <linearGradient id="emeraldGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="cyanGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="redGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F87171" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#DC2626" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glowGreen" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="glowCyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="glowRed" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="glowGold" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Isometric Grid Pattern -->
    <pattern id="isoGrid" width="60" height="104" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 60 52 L 30 104 L 0 52 Z" fill="none" stroke="#1E293B" stroke-width="0.75" stroke-opacity="0.25"/>
    </pattern>
  </defs>


    <rect width="1080" height="1920" fill="url(#bgRadialRed)"/>
    <rect width="1080" height="1920" fill="url(#isoGrid)"/>

    <!-- Top Minimal Eyebrow & Giant Stat -->
    <g transform="translate(90, 290)">
      <rect x="0" y="0" width="250" height="38" rx="19" fill="#EF4444" fill-opacity="0.15" stroke="#EF4444" stroke-width="1.5"/>
      <text x="125" y="24" text-anchor="middle" font-size="14" font-weight="900" fill="#F87171" letter-spacing="2">RÀO CẢN HỆ THỐNG</text>
      
      <text x="0" y="95" font-size="44" font-weight="800" fill="#94A3B8">TÍN DỤNG / GDP</text>
      <text x="0" y="175" font-size="96" font-weight="900" fill="url(#redGlass)" filter="url(#glowRed)">> 133%</text>
      <text x="370" y="155" font-size="26" font-weight="800" fill="#EF4444">QUÁ TẢI CHỊU LỰC</text>
    </g>

    <!-- 3D CENTRAL PIECE: Massive Bank Vault Cracking Under High Pressure -->
    <g transform="translate(540, 960)">
      <!-- Red Stress Aura -->
      <circle cx="0" cy="0" r="360" fill="#DC2626" opacity="0.1" filter="url(#glowRed)"/>

      <!-- 3D Isometric Steel Vault Body -->
      <!-- Top Face -->
      <polygon points="0,-240 240,-120 0,0 -240,-120" fill="#334155" stroke="#475569" stroke-width="3"/>
      <!-- Right Face -->
      <polygon points="240,-120 240,160 0,280 0,0" fill="#1E293B" stroke="#334155" stroke-width="3"/>
      <!-- Left Face -->
      <polygon points="-240,-120 0,0 0,280 -240,160" fill="#0F172A" stroke="#1E293B" stroke-width="3"/>

      <!-- Circular Vault Door with Lock Spokes (Front left/right) -->
      <g transform="translate(100, 80) scale(0.9, 1.2) rotate(15)">
        <circle cx="0" cy="0" r="85" fill="#1E293B" stroke="#64748B" stroke-width="6"/>
        <circle cx="0" cy="0" r="65" fill="#0F172A" stroke="#475569" stroke-width="3"/>
        <line x1="-50" y1="0" x2="50" y2="0" stroke="#CBD5E1" stroke-width="8"/>
        <line x1="0" y1="-50" x2="0" y2="50" stroke="#CBD5E1" stroke-width="8"/>
        <circle cx="0" cy="0" r="22" fill="#E2E8F0"/>
      </g>

      <!-- DEEP CRACKS ON STEEL VAULT (Glowing Fiery Red) -->
      <path d="M -120,-60 L -60,40 L -90,120 L -30,190 L 10,240" stroke="#EF4444" stroke-width="8" fill="none" filter="url(#glowRed)"/>
      <path d="M -60,40 L 20,20 L 70,70" stroke="#F87171" stroke-width="5" fill="none" filter="url(#glowRed)"/>
      <path d="M 0,-180 L -40,-80 L 10,-30" stroke="#EF4444" stroke-width="6" fill="none" filter="url(#glowRed)"/>

      <!-- Pressure Gauge Meter mounted on top -->
      <g transform="translate(-100, -220)">
        <circle cx="0" cy="0" r="70" fill="#0F172A" stroke="#E2E8F0" stroke-width="4"/>
        <path d="M -50,15 A 55 55 0 0 1 50,15" stroke="#334155" stroke-width="12" fill="none"/>
        <path d="M 15,-52 A 55 55 0 0 1 50,15" stroke="#DC2626" stroke-width="14" fill="none" filter="url(#glowRed)"/>
        <!-- Needle hitting Max Red -->
        <line x1="0" y1="0" x2="42" y2="-36" stroke="#EF4444" stroke-width="6"/>
        <circle cx="0" cy="0" r="10" fill="#F8FAFC"/>
        <text x="0" y="32" text-anchor="middle" font-size="14" font-weight="900" fill="#EF4444">MAX 133%</text>
      </g>
    </g>

    <!-- Bottom Minimal Key Callout -->
    <g transform="translate(90, 1460)">
      <text x="0" y="30" font-size="28" font-weight="900" fill="#F87171">VỐN NGẮN HẠN KHÔNG THỂ GÁNH SIÊU DỰ ÁN 30 NĂM</text>
      <text x="0" y="65" font-size="20" font-weight="500" fill="#94A3B8">Ép ngân hàng ôm tiếp sẽ kích hoạt nợ xấu toàn hệ thống.</text>
    </g>

</svg>