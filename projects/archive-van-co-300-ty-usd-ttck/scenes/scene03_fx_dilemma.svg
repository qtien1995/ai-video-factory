<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">

  <defs>
    
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,600;0,700;0,800;0,900;1,700&amp;display=swap');
      * { font-family: 'Be Vietnam Pro', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .mono { font-family: 'SF Mono', Consolas, Monaco, monospace; }
      .glow-green { filter: url(#glowGreen); }
      .glow-cyan { filter: url(#glowCyan); }
      .glow-red { filter: url(#glowRed); }
      .glow-gold { filter: url(#glowGold); }
    </style>

    
    <!-- Gradients Background Deep OLED Space -->
    <radialGradient id="bgRadialOLED" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#071329"/>
      <stop offset="50%" stop-color="#030814"/>
      <stop offset="100%" stop-color="#010307"/>
    </radialGradient>
    
    <radialGradient id="bgRadialRed" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#1A0508"/>
      <stop offset="50%" stop-color="#0B0204"/>
      <stop offset="100%" stop-color="#020001"/>
    </radialGradient>

    <radialGradient id="bgRadialEmerald" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#042316"/>
      <stop offset="50%" stop-color="#020F0A"/>
      <stop offset="100%" stop-color="#010403"/>
    </radialGradient>

    <!-- Metallic Materials 3D -->
    <linearGradient id="gold3D" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF275"/>
      <stop offset="30%" stop-color="#EAB308"/>
      <stop offset="70%" stop-color="#CA8A04"/>
      <stop offset="100%" stop-color="#713F12"/>
    </linearGradient>

    <linearGradient id="steel3D" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="35%" stop-color="#94A3B8"/>
      <stop offset="70%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>

    <linearGradient id="darkSteel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <linearGradient id="emeraldGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="cyanGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="redGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F87171" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#DC2626" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glowGreen" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="glowCyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="glowRed" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="glowGold" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Isometric Grid Pattern -->
    <pattern id="isoGrid" width="60" height="104" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 60 52 L 30 104 L 0 52 Z" fill="none" stroke="#1E293B" stroke-width="0.75" stroke-opacity="0.25"/>
    </pattern>
  </defs>


    <rect width="1080" height="1920" fill="url(#bgRadialOLED)"/>
    <rect width="1080" height="1920" fill="url(#isoGrid)"/>

    <g transform="translate(90, 290)">
      <rect x="0" y="0" width="240" height="38" rx="19" fill="#F59E0B" fill-opacity="0.15" stroke="#F59E0B" stroke-width="1.5"/>
      <text x="120" y="24" text-anchor="middle" font-size="14" font-weight="900" fill="#FBBF24" letter-spacing="2">GỌNG KÌM VĨ MÔ</text>
      
      <text x="0" y="95" font-size="44" font-weight="800" fill="#94A3B8">ÁP LỰC NGOẠI HỐI</text>
      <text x="0" y="165" font-size="76" font-weight="900" fill="#FFFFFF">CẦU USD <tspan fill="#F59E0B">VỌT ĐỈNH</tspan></text>
    </g>

    <!-- 3D CENTRAL PIECE: Giant Mechanical Balance Scale (Bàn cân 3D) -->
    <g transform="translate(540, 950)">
      <!-- Scale Main Pillar -->
      <rect x="-16" y="-120" width="32" height="380" fill="url(#steel3D)" rx="6"/>
      <polygon points="0,260 140,320 0,380 -140,320" fill="#0F172A" stroke="#334155" stroke-width="3"/>
      
      <!-- Fulcrum Pivot Point -->
      <circle cx="0" cy="-120" r="32" fill="url(#gold3D)" stroke="#FEF08A" stroke-width="3"/>
      
      <!-- Crossbeam tilted (Heavy on USD side on the left, up on right) -->
      <g transform="rotate(-18)">
        <rect x="-340" y="-12" width="680" height="24" fill="url(#steel3D)" rx="10"/>
        
        <!-- Left Suspension Cable & Pan (HEAVY USD) -->
        <g transform="translate(-300, 0)">
          <line x1="0" y1="12" x2="-80" y2="180" stroke="#94A3B8" stroke-width="2.5"/>
          <line x1="0" y1="12" x2="80" y2="180" stroke="#94A3B8" stroke-width="2.5"/>
          <ellipse cx="0" cy="180" rx="110" ry="24" fill="url(#darkSteel)" stroke="#475569" stroke-width="3"/>
          
          <!-- Stack of USD Cash Bundles on Left Pan -->
          <g transform="translate(0, 110)">
            <rect x="-70" y="0" width="140" height="45" fill="#15803D" stroke="#86EFAC" stroke-width="2" rx="4"/>
            <text x="0" y="30" text-anchor="middle" font-size="24" font-weight="900" fill="#FEF08A">$ USD $</text>
            <rect x="-60" y="-35" width="120" height="38" fill="#166534" stroke="#86EFAC" stroke-width="2" rx="4"/>
            <text x="0" y="-10" text-anchor="middle" font-size="20" font-weight="900" fill="#FEF08A">$ 100 $</text>
          </g>
        </g>

        <!-- Right Suspension Cable & Pan (UP HIGH: Capital Goods & Container Ship) -->
        <g transform="translate(300, 0)">
          <line x1="0" y1="12" x2="-80" y2="180" stroke="#94A3B8" stroke-width="2.5"/>
          <line x1="0" y1="12" x2="80" y2="180" stroke="#94A3B8" stroke-width="2.5"/>
          <ellipse cx="0" cy="180" rx="110" ry="24" fill="url(#darkSteel)" stroke="#475569" stroke-width="3"/>
          
          <!-- Cargo Containers & Machinery Gears -->
          <g transform="translate(0, 120)">
            <rect x="-65" y="0" width="60" height="40" fill="#0284C7" stroke="#38BDF8" stroke-width="1.5" rx="2"/>
            <rect x="5" y="0" width="60" height="40" fill="#E11D48" stroke="#FDA4AF" stroke-width="1.5" rx="2"/>
            <circle cx="0" cy="-25" r="28" fill="#475569" stroke="#94A3B8" stroke-width="4"/>
            <text x="0" y="-20" text-anchor="middle" font-size="12" font-weight="900" fill="#FFF">CHIP</text>
          </g>
        </g>
      </g>
    </g>

    <!-- Bottom Minimal Key Callout -->
    <g transform="translate(90, 1460)">
      <text x="0" y="30" font-size="28" font-weight="800" fill="#FBBF24">NHẬP KHẨU MÁY MÓC TƯ LIỆU SẢN XUẤT (CAPITAL GOODS)</text>
      <text x="0" y="65" font-size="20" font-weight="500" fill="#94A3B8">Buộc SBV thắt chặt cung tiền ➔ Chấm dứt thời kỳ tiền rẻ.</text>
    </g>

</svg>