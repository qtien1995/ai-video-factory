<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">

  <defs>
    
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,600;0,700;0,800;0,900;1,700&amp;display=swap');
      * { font-family: 'Be Vietnam Pro', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .mono { font-family: 'SF Mono', Consolas, Monaco, monospace; }
      .glow-green { filter: url(#glowGreen); }
      .glow-cyan { filter: url(#glowCyan); }
      .glow-red { filter: url(#glowRed); }
      .glow-gold { filter: url(#glowGold); }
    </style>

    
    <!-- Gradients Background Deep OLED Space -->
    <radialGradient id="bgRadialOLED" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#071329"/>
      <stop offset="50%" stop-color="#030814"/>
      <stop offset="100%" stop-color="#010307"/>
    </radialGradient>
    
    <radialGradient id="bgRadialRed" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#1A0508"/>
      <stop offset="50%" stop-color="#0B0204"/>
      <stop offset="100%" stop-color="#020001"/>
    </radialGradient>

    <radialGradient id="bgRadialEmerald" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#042316"/>
      <stop offset="50%" stop-color="#020F0A"/>
      <stop offset="100%" stop-color="#010403"/>
    </radialGradient>

    <!-- Metallic Materials 3D -->
    <linearGradient id="gold3D" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF275"/>
      <stop offset="30%" stop-color="#EAB308"/>
      <stop offset="70%" stop-color="#CA8A04"/>
      <stop offset="100%" stop-color="#713F12"/>
    </linearGradient>

    <linearGradient id="steel3D" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="35%" stop-color="#94A3B8"/>
      <stop offset="70%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>

    <linearGradient id="darkSteel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <linearGradient id="emeraldGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="cyanGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="redGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F87171" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#DC2626" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glowGreen" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="glowCyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="glowRed" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="glowGold" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Isometric Grid Pattern -->
    <pattern id="isoGrid" width="60" height="104" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 60 52 L 30 104 L 0 52 Z" fill="none" stroke="#1E293B" stroke-width="0.75" stroke-opacity="0.25"/>
    </pattern>
  </defs>


    <rect width="1080" height="1920" fill="url(#bgRadialOLED)"/>
    <rect width="1080" height="1920" fill="url(#isoGrid)"/>

    <g transform="translate(90, 290)">
      <rect x="0" y="0" width="270" height="38" rx="19" fill="#06B6D4" fill-opacity="0.15" stroke="#06B6D4" stroke-width="1.5"/>
      <text x="135" y="24" text-anchor="middle" font-size="14" font-weight="900" fill="#38BDF8" letter-spacing="2">HẠ TẦNG TÀI CHÍNH</text>
      
      <text x="0" y="95" font-size="44" font-weight="800" fill="#94A3B8">THỊ TRƯỜNG VỐN GÁNH</text>
      <text x="0" y="175" font-size="92" font-weight="900" fill="url(#cyanGlass)" filter="url(#glowCyan)">70% NGUỒN LỰC</text>
    </g>

    <!-- 3D CENTRAL PIECE: Hydraulic Capital Pipeline Manifold (Đường ống dòng tiền) -->
    <g transform="translate(540, 950)">
      <!-- Background Glow for Open Valve -->
      <circle cx="160" cy="80" r="260" fill="#0284C7" opacity="0.15" filter="url(#glowCyan)"/>

      <!-- Main Incoming Mega Pipe (Top) -->
      <rect x="-80" y="-360" width="160" height="180" fill="url(#steel3D)" stroke="#94A3B8" stroke-width="3"/>
      <ellipse cx="0" cy="-360" rx="80" ry="24" fill="#64748B" stroke="#CBD5E1" stroke-width="3"/>
      <text x="0" y="-260" text-anchor="middle" font-size="22" font-weight="900" fill="#0F172A">DÒNG VỐN 300B</text>

      <!-- Central Junction Chamber -->
      <polygon points="0,-180 180,-80 0,20 -180,-80" fill="#334155" stroke="#64748B" stroke-width="4"/>
      
      <!-- Left Pipe: Bank 30% (CLOSED VALVE) -->
      <g transform="translate(-160, -20)">
        <rect x="-60" y="0" width="120" height="240" fill="#1E293B" stroke="#475569" stroke-width="3"/>
        <!-- Red Closed Wheel Valve -->
        <circle cx="0" cy="100" r="45" fill="#7F1D1D" stroke="#EF4444" stroke-width="6"/>
        <line x1="-35" y1="100" x2="35" y2="100" stroke="#FFF" stroke-width="6"/>
        <line x1="0" y1="65" x2="0" y2="135" stroke="#FFF" stroke-width="6"/>
        <text x="0" y="190" text-anchor="middle" font-size="18" font-weight="800" fill="#EF4444">NGÂN SÁCH 30%</text>
        <text x="0" y="215" text-anchor="middle" font-size="14" font-weight="600" fill="#94A3B8">[KHÓA CHẶT]</text>
      </g>

      <!-- Right Pipe: Stock Market & Bonds 70% (WIDE OPEN MEGA THICK FLOW) -->
      <g transform="translate(160, -20)">
        <rect x="-90" y="0" width="180" height="340" fill="#0C4A6E" stroke="#0284C7" stroke-width="4"/>
        <!-- Gushing Radiant Cyan Energy Beam Inside Pipe -->
        <rect x="-70" y="10" width="140" height="320" fill="url(#cyanGlass)" filter="url(#glowCyan)"/>
        
        <!-- Golden Open Wheel Valve -->
        <circle cx="0" cy="80" r="60" fill="url(#gold3D)" stroke="#FEF08A" stroke-width="6"/>
        <circle cx="0" cy="80" r="25" fill="#0C4A6E"/>
        <text x="0" y="180" text-anchor="middle" font-size="24" font-weight="900" fill="#38BDF8">CHỨNG KHOÁN 70%</text>
        <text x="0" y="215" text-anchor="middle" font-size="28" font-weight="900" fill="#F8FAFC">> $210B / NĂM</text>
        <text x="0" y="245" text-anchor="middle" font-size="14" font-weight="800" fill="#34D399">[MỞ TOANG VAN XẢ]</text>
      </g>
    </g>

    <g transform="translate(90, 1460)">
      <text x="0" y="30" font-size="28" font-weight="900" fill="#38BDF8">TỪ SÒNG BẠC ĐẦU CƠ ➔ HẠ TẦNG DẪN VỐN QUỐC GIA</text>
      <text x="0" y="65" font-size="20" font-weight="500" fill="#94A3B8">Cổ phiếu &amp; Trái phiếu trở thành huyết mạch sống còn.</text>
    </g>

</svg>