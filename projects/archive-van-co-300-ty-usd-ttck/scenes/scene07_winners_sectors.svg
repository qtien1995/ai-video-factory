<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">

  <defs>
    
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,600;0,700;0,800;0,900;1,700&amp;display=swap');
      * { font-family: 'Be Vietnam Pro', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .mono { font-family: 'SF Mono', Consolas, Monaco, monospace; }
      .glow-green { filter: url(#glowGreen); }
      .glow-cyan { filter: url(#glowCyan); }
      .glow-red { filter: url(#glowRed); }
      .glow-gold { filter: url(#glowGold); }
    </style>

    
    <!-- Gradients Background Deep OLED Space -->
    <radialGradient id="bgRadialOLED" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#071329"/>
      <stop offset="50%" stop-color="#030814"/>
      <stop offset="100%" stop-color="#010307"/>
    </radialGradient>
    
    <radialGradient id="bgRadialRed" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#1A0508"/>
      <stop offset="50%" stop-color="#0B0204"/>
      <stop offset="100%" stop-color="#020001"/>
    </radialGradient>

    <radialGradient id="bgRadialEmerald" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#042316"/>
      <stop offset="50%" stop-color="#020F0A"/>
      <stop offset="100%" stop-color="#010403"/>
    </radialGradient>

    <!-- Metallic Materials 3D -->
    <linearGradient id="gold3D" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF275"/>
      <stop offset="30%" stop-color="#EAB308"/>
      <stop offset="70%" stop-color="#CA8A04"/>
      <stop offset="100%" stop-color="#713F12"/>
    </linearGradient>

    <linearGradient id="steel3D" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="35%" stop-color="#94A3B8"/>
      <stop offset="70%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>

    <linearGradient id="darkSteel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <linearGradient id="emeraldGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="cyanGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="redGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F87171" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#DC2626" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glowGreen" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="glowCyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="glowRed" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="glowGold" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Isometric Grid Pattern -->
    <pattern id="isoGrid" width="60" height="104" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 60 52 L 30 104 L 0 52 Z" fill="none" stroke="#1E293B" stroke-width="0.75" stroke-opacity="0.25"/>
    </pattern>
  </defs>


    <rect width="1080" height="1920" fill="url(#bgRadialOLED)"/>
    <rect width="1080" height="1920" fill="url(#isoGrid)"/>

    <g transform="translate(90, 290)">
      <rect x="0" y="0" width="280" height="38" rx="19" fill="#F59E0B" fill-opacity="0.15" stroke="#F59E0B" stroke-width="1.5"/>
      <text x="140" y="24" text-anchor="middle" font-size="14" font-weight="900" fill="#FBBF24" letter-spacing="2">DÒNG TIỀN CHỌN LỌC</text>
      
      <text x="0" y="95" font-size="44" font-weight="800" fill="#94A3B8">300 TỶ USD CHẢY VÀO ĐÂU?</text>
      <text x="0" y="165" font-size="76" font-weight="900" fill="url(#gold3D)" filter="url(#glowGold)">3 TRỤ CỘT ĐỘC QUYỀN</text>
    </g>

    <!-- 3D CENTRAL PIECE: 3 Elevated Isometric Pedestals with Authentic Iconic Cut-outs -->
    <g transform="translate(540, 950)">
      <!-- Left Pedestal: Thép & Vật liệu EPC (HPG, CTR, PC1) -->
      <g transform="translate(-260, 40)">
        <polygon points="0,-100 110,-45 0,10 -110,-45" fill="#334155" stroke="#10B981" stroke-width="2"/>
        <polygon points="110,-45 110,95 0,150 0,10" fill="#1E293B"/>
        <polygon points="-110,-45 0,10 0,150 -110,95" fill="#0F172A"/>

        <!-- Fiery Glowing Steel Ingot on top -->
        <g transform="translate(0, -90)">
          <polygon points="-50,-20 0,-40 50,-20 0,0" fill="#EA580C" filter="url(#glowRed)"/>
          <polygon points="50,-20 50,15 0,35 0,0" fill="#C2410C"/>
          <polygon points="-50,-20 0,0 0,35 -50,15" fill="#9A3412"/>
          <text x="0" y="10" text-anchor="middle" font-size="16" font-weight="900" fill="#FFF">THÉP HPG</text>
        </g>
        <text x="0" y="195" text-anchor="middle" font-size="20" font-weight="900" fill="#10B981">VẬT LIỆU &amp; EPC</text>
        <text x="0" y="225" text-anchor="middle" font-size="14" font-weight="700" fill="#94A3B8">HPG · CTR · PC1</text>
      </g>

      <!-- Center Highest Pedestal: Tài chính & Ngân hàng Đầu tư (SSI, VCI, TCB, MBB) -->
      <g transform="translate(0, -90)">
        <polygon points="0,-120 130,-55 0,10 -130,-55" fill="url(#steel3D)" stroke="#FEF08A" stroke-width="3" filter="url(#glowGold)"/>
        <polygon points="130,-55 130,120 0,185 0,10" fill="#1E293B"/>
        <polygon points="-130,-55 0,10 0,185 -130,120" fill="#0F172A"/>

        <!-- Floating Golden Stock Exchange & Bloomberg Terminal Icon -->
        <g transform="translate(0, -110)">
          <rect x="-55" y="-40" width="110" height="70" fill="#0284C7" stroke="#38BDF8" stroke-width="3" rx="6"/>
          <path d="M -40,10 L -20,-15 L 0,-5 L 20,-25 L 40,-10" stroke="#34D399" stroke-width="4" fill="none"/>
          <text x="0" y="45" text-anchor="middle" font-size="14" font-weight="900" fill="#FEF08A">IB &amp; MARGIN</text>
        </g>
        <text x="0" y="230" text-anchor="middle" font-size="24" font-weight="900" fill="#FEF08A">TÀI CHÍNH &amp; IB</text>
        <text x="0" y="260" text-anchor="middle" font-size="16" font-weight="800" fill="#FFF">SSI · VCI · TCB · MBB</text>
      </g>

      <!-- Right Pedestal: BĐS KCN & Cảng biển (IDC, BCM, GMD) -->
      <g transform="translate(260, 40)">
        <polygon points="0,-100 110,-45 0,10 -110,-45" fill="#334155" stroke="#0284C7" stroke-width="2"/>
        <polygon points="110,-45 110,95 0,150 0,10" fill="#1E293B"/>
        <polygon points="-110,-45 0,10 0,150 -110,95" fill="#0F172A"/>

        <!-- Cargo Container Crane Icon on top -->
        <g transform="translate(0, -90)">
          <rect x="-40" y="-15" width="80" height="35" fill="#0D9488" stroke="#5EEAD4" stroke-width="2" rx="3"/>
          <line x1="-30" y1="-15" x2="0" y2="-45" stroke="#94A3B8" stroke-width="4"/>
          <line x1="30" y1="-15" x2="0" y2="-45" stroke="#94A3B8" stroke-width="4"/>
          <text x="0" y="10" text-anchor="middle" font-size="14" font-weight="900" fill="#FFF">CẢNG BIỂN</text>
        </g>
        <text x="0" y="195" text-anchor="middle" font-size="20" font-weight="900" fill="#38BDF8">BĐS KCN &amp; CẢNG</text>
        <text x="0" y="225" text-anchor="middle" font-size="14" font-weight="700" fill="#94A3B8">IDC · BCM · GMD</text>
      </g>
    </g>

    <g transform="translate(90, 1460)">
      <text x="0" y="30" font-size="28" font-weight="900" fill="#FEF08A">CHỈ MUA CỦA "CHỦ ĐẦU TƯ" VÀ "ĐỘC QUYỀN QUY MÔ"</text>
      <text x="0" y="65" font-size="20" font-weight="500" fill="#94A3B8">Tuyệt đối né tránh các doanh nghiệp thầu phụ, gia công biên mỏng.</text>
    </g>

</svg>